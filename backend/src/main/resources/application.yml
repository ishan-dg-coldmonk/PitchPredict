spring:
  profiles:
    # Local dev defaults to the H2 profile; set SPRING_PROFILES_ACTIVE=prod on the server.
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:pitchpredict-super-secret-key-that-is-256-bits-long-for-hmac-sha512}
  expiration: 86400000

football-data:
  api-key: ${FOOTBALL_DATA_API_KEY:}
  base-url: https://api.football-data.org/v4

# AI score suggestions via OpenRouter (OpenAI-compatible). Set OPENROUTER_API_KEY to
# enable; leave unset to disable the feature (the modal simply won't show a suggestion).
openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  base-url: https://openrouter.ai/api/v1
  model: ${OPENROUTER_MODEL:poolside/laguna-xs-2.1:free}
